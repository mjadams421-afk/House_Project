<!DOCTYPE html>
<html>

<head>
<title>
 House Project
</title>
<link href="style.css" type="text/css" rel="stylesheet">

</head>

<header>
<h1>House Project</h1>
</header>

<article>
<button id="DataButton" type="button">Click to enter data</button>
<p id="DataDisplay">RESPONSE</p>

<script>
const Data = document.getElementById('DataButton');
//Response for variables
const DDisplay = document.getElementById('DataDisplay');



function DataDisplay() {
 const SF = window.prompt('Enter Square Foot');
 const BathroomNum = window.prompt('Enter Number of Bathrooms');
 const BedroomNum = window.prompt('Enter Number of Bedrooms');
 let Response = ''
    if(SF > 3000) { Response += 'This is a large house. '; }
    else if(SF > 2000) { Response += 'This is a medium house. '; }
    else { Response += 'This is a small house. '; }
    if(BathroomNum > 3) { Response += 'This house has many bathrooms. '; }
    else if(BathroomNum > 1) { Response += 'This house has a decent amount of bathrooms. '; }
    else { Response += 'This house has few bathrooms. '; }
    if(BedroomNum > 4) { Response += 'This house has many bedrooms. '; }
    else if(BedroomNum > 2) { Response += 'This house has a decent amount of bedrooms. '; }
    else { Response += 'This house has few bedrooms. '; }
 DDisplay.innerHTML = Response;
}
Data.addEventListener('mousedown', DataDisplay);


</script>

</article>

</html>
